<svg xmlns="http://www.w3.org/2000/svg" width="760" height="770" viewBox="0 0 760 770" role="img" aria-labelledby="title desc"><title id="title">Alimenter l’écran : vérifier sa variante</title><desc id="desc">USB 5 V avec chargeur ou powerbank si la variante le prévoit. Secteur seulement sur la variante équipée, avec bornes protégées.</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#007dad"/></marker><marker id="brown" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a04d14"/></marker></defs><rect width="760" height="770" rx="22" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="49" font-size="31" fill="#102f45" font-weight="700">Alimenter l’écran : vérifier sa variante</text><text x="32" y="86" font-size="23" fill="#213348" font-weight="400">Le dos et les connecteurs varient selon le matériel.</text><rect x="24" y="116" width="712" height="292" rx="18" fill="#fff" stroke="#d4dee8" stroke-width="2"/><text x="47" y="158" font-size="25" fill="#00668f" font-weight="700">ENTRÉE USB 5 V PRÉVUE SUR VOTRE ÉCRAN</text><rect x="48" y="190" width="255" height="93" rx="18" fill="#e6f5fd" stroke="#007dad" stroke-width="2"/><text x="68" y="226" font-size="24" fill="#213348" font-weight="400">Chargeur USB 5 V</text><text x="68" y="259" font-size="24" fill="#213348" font-weight="400">ou powerbank 5 V</text><path d="M308 235H401" fill="none" stroke="#007dad" stroke-width="4" marker-end="url(#blue)"/><rect x="428" y="199" width="84" height="68" rx="10" fill="#e6f5fd" stroke="#007dad" stroke-width="2"/><rect x="437" y="208" width="66" height="42" rx="4" fill="#fff" stroke="#007dad" stroke-width="2"/><path d="M458 267v12m-12 0h48" stroke="#007dad" stroke-width="3"/><text x="539" y="234" font-size="27" fill="#00668f" font-weight="700">ÉCRAN</text><text x="48" y="334" font-size="24" fill="#213348" font-weight="400">Câble compatible et alimentation adaptée.</text><text x="48" y="367" font-size="24" fill="#213348" font-weight="400">Pas de batterie intégrée. Autonomie non chiffrée.</text><rect x="24" y="442" width="712" height="220" rx="18" fill="#fff6ed" stroke="#a04d14" stroke-width="2"/><text x="47" y="483" font-size="25" fill="#8e4412" font-weight="700">VARIANTE AVEC ALIMENTATION SECTEUR</text><text x="47" y="525" font-size="23" fill="#213348" font-weight="400">230 V uniquement sur l’entrée prévue et marquée.</text><text x="47" y="557" font-size="23" fill="#213348" font-weight="400">Bornes protégées dans un montage adapté.</text><text x="47" y="589" font-size="23" fill="#213348" font-weight="400">Raccordement par une personne compétente.</text><text x="47" y="621" font-size="23" fill="#213348" font-weight="400">Ne jamais appliquer 230 V à une entrée USB.</text><text x="32" y="707" font-size="24" fill="#8e4412" font-weight="700">Ce dessin n’est pas un plan de raccordement.</text><text x="32" y="746" font-size="22" fill="#213348" font-weight="400">Ne pas choisir l’alimentation d’après la seule façade.</text></g></svg>
