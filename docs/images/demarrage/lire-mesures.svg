<svg xmlns="http://www.w3.org/2000/svg" width="760" height="704" viewBox="0 0 760 704" role="img" aria-labelledby="title desc"><title id="title">Lire les mesures : puissance et énergie</title><desc id="desc">Illustration des rubriques du tableau de bord. W et kW sont une puissance instantanée, kWh est une énergie cumulée.</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#007dad"/></marker><marker id="brown" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a04d14"/></marker></defs><rect width="760" height="704" rx="22" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="49" font-size="32" fill="#102f45" font-weight="700">Lire les mesures sans se tromper</text><text x="32" y="86" font-size="23" fill="#213348" font-weight="400">Repères simplifiés, ce dessin n’est pas une capture.</text><rect x="24" y="118" width="342" height="147" rx="18" fill="#fff" stroke="#d4dee8" stroke-width="2"/><text x="45" y="156" font-size="26" fill="#00668f" font-weight="700">PV / SOLAIRE</text><text x="45" y="198" font-size="23" fill="#213348" font-weight="400">Production des panneaux.</text><text x="45" y="230" font-size="23" fill="#213348" font-weight="400">W ou kW à cet instant.</text><rect x="394" y="118" width="342" height="147" rx="18" fill="#fff" stroke="#d4dee8" stroke-width="2"/><text x="415" y="156" font-size="26" fill="#00668f" font-weight="700">BATTERIE / SOC</text><text x="415" y="198" font-size="23" fill="#213348" font-weight="400">SOC = charge en %.</text><text x="415" y="230" font-size="23" fill="#213348" font-weight="400">Exemple : 65 % restants.</text><rect x="24" y="292" width="342" height="147" rx="18" fill="#fff" stroke="#d4dee8" stroke-width="2"/><text x="45" y="330" font-size="26" fill="#00668f" font-weight="700">RÉSEAU</text><text x="45" y="372" font-size="23" fill="#213348" font-weight="400">Échanges avec</text><text x="45" y="404" font-size="23" fill="#213348" font-weight="400">le réseau public.</text><rect x="394" y="292" width="342" height="147" rx="18" fill="#fff" stroke="#d4dee8" stroke-width="2"/><text x="415" y="330" font-size="26" fill="#00668f" font-weight="700">MAISON</text><text x="415" y="372" font-size="23" fill="#213348" font-weight="400">Consommation de</text><text x="415" y="404" font-size="23" fill="#213348" font-weight="400">votre installation.</text><rect x="24" y="478" width="712" height="196" rx="18" fill="#fff6ed" stroke="#a04d14" stroke-width="2"/><text x="47" y="519" font-size="24" fill="#213348" font-weight="400">W / kW = puissance maintenant.</text><text x="47" y="552" font-size="24" fill="#213348" font-weight="400">kWh / JOUR = énergie depuis le début de la journée.</text><text x="47" y="585" font-size="24" fill="#213348" font-weight="400">~ devant une valeur = estimation.</text><text x="47" y="618" font-size="24" fill="#213348" font-weight="400">-- = mesure indisponible, pas forcément zéro.</text></g></svg>
