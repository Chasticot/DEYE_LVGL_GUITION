<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360"><rect width="960" height="360" rx="20" fill="#eef5f6"/><g font-family="Arial, sans-serif" fill="#183144"><text x="30" y="46" font-size="26" font-weight="bold">Prévision solaire : saisir chaque information au bon format</text><rect x="24" y="72" width="288" height="200" rx="12" fill="white"/><circle cx="54" cy="105" r="17" fill="#087e8b"/><text x="54" y="112" text-anchor="middle" fill="white" font-size="21">1</text><text x="79" y="112" font-size="19" font-weight="bold">Latitude</text><text x="42" y="153" font-size="19">Exemple de format :</text><text x="42" y="182" font-size="19">48.8566</text><text x="42" y="211" font-size="19">Une seule coordonnée</text><text x="42" y="240" font-size="19">Sans ° ni lettre N / S</text><rect x="336" y="72" width="288" height="200" rx="12" fill="white"/><circle cx="366" cy="105" r="17" fill="#087e8b"/><text x="366" y="112" text-anchor="middle" fill="white" font-size="21">2</text><text x="391" y="112" font-size="19" font-weight="bold">Longitude</text><text x="354" y="153" font-size="19">Exemple de format :</text><text x="354" y="182" font-size="19">2.3522</text><text x="354" y="211" font-size="19">Conserver le signe −</text><text x="354" y="240" font-size="19">pour une valeur négative</text><rect x="648" y="72" width="288" height="200" rx="12" fill="white"/><circle cx="678" cy="105" r="17" fill="#087e8b"/><text x="678" y="112" text-anchor="middle" fill="white" font-size="21">3</text><text x="703" y="112" font-size="19" font-weight="bold">Puissance des panneaux</text><text x="666" y="153" font-size="19">8 000 Wc = 8 kWc</text><text x="666" y="182" font-size="19">Saisir : 8</text><text x="666" y="211" font-size="19">Pas : 8000</text><text x="666" y="240" font-size="19">Pas la puissance du Deye</text><text x="30" y="310" font-size="20" font-weight="bold">Recopier la position réelle des panneaux, latitude puis longitude.</text><text x="30" y="338" font-size="16">Schéma explicatif : les exemples ne sont pas les réglages de votre installation.</text></g></svg>