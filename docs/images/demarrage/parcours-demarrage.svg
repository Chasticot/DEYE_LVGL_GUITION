<svg xmlns="http://www.w3.org/2000/svg" width="760" height="790" viewBox="0 0 760 790" role="img" aria-labelledby="title desc"><title id="title">Votre première mise en route</title><desc id="desc">Alimenter, connecter au Wi-Fi, choisir le modèle et le logger, puis vérifier les mesures et l’heure.</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#007dad"/></marker><marker id="brown" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a04d14"/></marker></defs><rect width="760" height="790" rx="22" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="49" font-size="33" fill="#102f45" font-weight="700">Votre première mise en route</text><text x="32" y="84" font-size="23" fill="#213348" font-weight="400">Un écran déjà prêt ne demande pas de réinstallation.</text><rect x="24" y="109" width="712" height="114" rx="18" fill="#fff" stroke="#d4dee8" stroke-width="2"/><circle cx="56" cy="140" r="22" fill="#007dad"/><text x="49" y="149" font-size="25" fill="#fff" font-weight="700">1</text><text x="93" y="146" font-size="27" fill="#102f45" font-weight="700">Alimenter l’écran</text><text x="93" y="181" font-size="21" fill="#213348" font-weight="400">USB 5 V, si cette entrée est prévue.</text><text x="93" y="211" font-size="21" fill="#213348" font-weight="400">Vérifier la variante avant tout branchement.</text><rect x="24" y="237" width="712" height="114" rx="18" fill="#fff" stroke="#d4dee8" stroke-width="2"/><circle cx="56" cy="268" r="22" fill="#007dad"/><text x="49" y="277" font-size="25" fill="#fff" font-weight="700">2</text><text x="93" y="274" font-size="27" fill="#102f45" font-weight="700">Connecter le Wi-Fi</text><text x="93" y="309" font-size="21" fill="#213348" font-weight="400">RÉSEAU / HEURE → WIFI / RÉSEAU → SCAN</text><text x="93" y="339" font-size="21" fill="#213348" font-weight="400">Choisir le 2,4 GHz et sauvegarder.</text><rect x="24" y="365" width="712" height="114" rx="18" fill="#fff" stroke="#d4dee8" stroke-width="2"/><circle cx="56" cy="396" r="22" fill="#007dad"/><text x="49" y="405" font-size="25" fill="#fff" font-weight="700">3</text><text x="93" y="402" font-size="27" fill="#102f45" font-weight="700">Choisir le modèle DEYE</text><text x="93" y="437" font-size="21" fill="#213348" font-weight="400">DEYE / SOLARMAN → MON ONDULEUR</text><text x="93" y="467" font-size="21" fill="#213348" font-weight="400">Recopier la référence complète de la plaque.</text><rect x="24" y="493" width="712" height="114" rx="18" fill="#fff" stroke="#d4dee8" stroke-width="2"/><circle cx="56" cy="524" r="22" fill="#007dad"/><text x="49" y="533" font-size="25" fill="#fff" font-weight="700">4</text><text x="93" y="530" font-size="27" fill="#102f45" font-weight="700">Connecter le logger</text><text x="93" y="565" font-size="21" fill="#213348" font-weight="400">CONNEXION / LOGGER : type et vrai numéro.</text><text x="93" y="595" font-size="21" fill="#213348" font-weight="400">Rechercher le bon appareil, puis sauvegarder.</text><rect x="24" y="621" width="712" height="114" rx="18" fill="#fff" stroke="#d4dee8" stroke-width="2"/><circle cx="56" cy="652" r="22" fill="#007dad"/><text x="49" y="661" font-size="25" fill="#fff" font-weight="700">5</text><text x="93" y="658" font-size="27" fill="#102f45" font-weight="700">Vérifier avant de terminer</text><text x="93" y="693" font-size="21" fill="#213348" font-weight="400">Comparer les mesures au LCD du DEYE.</text><text x="93" y="723" font-size="21" fill="#213348" font-weight="400">Contrôler aussi la date et l’heure.</text><text x="32" y="774" font-size="22" fill="#31576c" font-weight="400">Si les mesures sont déjà correctes, conserver les réglages.</text></g></svg>
