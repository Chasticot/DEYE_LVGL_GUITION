<svg xmlns="http://www.w3.org/2000/svg" width="760" height="844" viewBox="0 0 760 844" role="img" aria-labelledby="title desc"><title id="title">Avec la box : deux appareils, deux adresses</title><desc id="desc">Le logger et l’écran communiquent via le réseau local. Le téléphone ouvre l’IP de l’écran. Les IP sont des exemples.</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#007dad"/></marker><marker id="brown" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a04d14"/></marker></defs><rect width="760" height="844" rx="22" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="49" font-size="32" fill="#102f45" font-weight="700">Avec la box : les deux adresses IP</text><text x="32" y="86" font-size="24" fill="#213348" font-weight="400">IP = adresse d’un appareil sur votre réseau.</text><rect x="160" y="118" width="440" height="124" rx="18" fill="#e6f5fd" stroke="#007dad" stroke-width="2"/><text x="190" y="158" font-size="25" fill="#00668f" font-weight="700">BOX / RÉSEAU DE LA MAISON</text><text x="190" y="192" font-size="23" fill="#213348" font-weight="400">Les appareils doivent se joindre.</text><text x="190" y="224" font-size="23" fill="#213348" font-weight="400">Internet seul ne suffit pas.</text><path d="M260 244V290H195V321" fill="none" stroke="#007dad" stroke-width="4" marker-end="url(#blue)"/><path d="M500 244V290H565V321" fill="none" stroke="#007dad" stroke-width="4" marker-end="url(#blue)"/><rect x="24" y="337" width="342" height="219" rx="18" fill="#fff" stroke="#d4dee8" stroke-width="2"/><text x="45" y="376" font-size="25" fill="#00668f" font-weight="700">1. LOGGER DU DEYE</text><text x="45" y="413" font-size="24" fill="#213348" font-weight="400">Wi-Fi ou Ethernet</text><text x="45" y="446" font-size="24" fill="#213348" font-weight="400">selon le modèle.</text><text x="45" y="491" font-size="23" fill="#00668f" font-weight="700">IP exemple : 192.168.1.20</text><text x="45" y="532" font-size="21" fill="#213348" font-weight="400">L’écran lit ses mesures ici.</text><rect x="394" y="337" width="342" height="219" rx="18" fill="#fff6ed" stroke="#a04d14" stroke-width="2"/><text x="416" y="376" font-size="25" fill="#8e4412" font-weight="700">2. ÉCRAN TACTILE</text><text x="416" y="413" font-size="24" fill="#213348" font-weight="400">Wi-Fi 2,4 GHz</text><text x="416" y="446" font-size="24" fill="#213348" font-weight="400">sur ce même réseau.</text><text x="416" y="491" font-size="23" fill="#8e4412" font-weight="700">IP exemple : 192.168.1.30</text><text x="416" y="532" font-size="21" fill="#213348" font-weight="400">Sa page Web se trouve ici.</text><rect x="24" y="622" width="712" height="127" rx="18" fill="#fff" stroke="#d4dee8" stroke-width="2"/><rect x="45" y="646" width="48" height="80" rx="8" fill="#e6f5fd" stroke="#007dad" stroke-width="2"/><path d="M61 656h16m-12 60h8" stroke="#007dad" stroke-width="3"/><text x="114" y="657" font-size="25" fill="#102f45" font-weight="700">TÉLÉPHONE / ORDINATEUR</text><text x="114" y="693" font-size="25" fill="#8e4412" font-weight="700">Même réseau → ouvrir http://192.168.1.30</text><text x="114" y="728" font-size="21" fill="#213348" font-weight="400">Pour consulter, sauvegarder ou mettre à jour l’écran.</text><path d="M566 620V574" fill="none" stroke="#a04d14" stroke-width="4" marker-end="url(#brown)"/><text x="32" y="790" font-size="22" fill="#8e4412" font-weight="700">Adresses fictives : relevez les vôtres dans vos appareils.</text><text x="32" y="823" font-size="21" fill="#213348" font-weight="400">Schéma de communication, pas de câblage électrique.</text></g></svg>
