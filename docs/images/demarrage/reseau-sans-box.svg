<svg xmlns="http://www.w3.org/2000/svg" width="760" height="763" viewBox="0 0 760 763" role="img" aria-labelledby="title desc"><title id="title">Sans box : réseau AP du logger LSW</title><desc id="desc">Le logger crée son propre Wi-Fi. L’écran et le téléphone le rejoignent. L’IP du logger n’est pas celle de l’écran.</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#007dad"/></marker><marker id="brown" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a04d14"/></marker></defs><rect width="760" height="763" rx="22" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="49" font-size="31" fill="#102f45" font-weight="700">Sans box : le Wi-Fi du logger LSW</text><text x="32" y="86" font-size="23" fill="#213348" font-weight="400">Pour un LSW doté d’un point d’accès compatible.</text><rect x="65" y="116" width="630" height="151" rx="18" fill="#e6f5fd" stroke="#007dad" stroke-width="2"/><text x="93" y="158" font-size="26" fill="#00668f" font-weight="700">LOGGER : SON PROPRE RÉSEAU « AP… »</text><text x="93" y="196" font-size="25" fill="#213348" font-weight="400">IP du logger : souvent 10.10.100.254</text><text x="93" y="230" font-size="25" fill="#213348" font-weight="400">À vérifier pour votre modèle.</text><path d="M265 270V312H190V347" fill="none" stroke="#007dad" stroke-width="4" marker-end="url(#blue)"/><path d="M505 270V312H570V347" fill="none" stroke="#007dad" stroke-width="4" marker-end="url(#blue)"/><rect x="24" y="363" width="342" height="201" rx="18" fill="#fff" stroke="#d4dee8" stroke-width="2"/><rect x="49" y="386" width="84" height="68" rx="10" fill="#e6f5fd" stroke="#007dad" stroke-width="2"/><rect x="58" y="395" width="66" height="42" rx="4" fill="#fff" stroke="#007dad" stroke-width="2"/><path d="M79 454v12m-12 0h48" stroke="#007dad" stroke-width="3"/><text x="149" y="415" font-size="27" fill="#00668f" font-weight="700">ÉCRAN</text><text x="46" y="501" font-size="24" fill="#213348" font-weight="400">Choisir le Wi-Fi AP…</text><text x="46" y="534" font-size="24" fill="#213348" font-weight="400">Lire les mesures du logger.</text><rect x="394" y="363" width="342" height="201" rx="18" fill="#fff" stroke="#d4dee8" stroke-width="2"/><rect x="419" y="386" width="48" height="80" rx="8" fill="#e6f5fd" stroke="#007dad" stroke-width="2"/><path d="M435 396h16m-12 60h8" stroke="#007dad" stroke-width="3"/><text x="486" y="415" font-size="26" fill="#00668f" font-weight="700">TÉLÉPHONE</text><text x="416" y="501" font-size="24" fill="#213348" font-weight="400">Rejoindre le même AP…</text><text x="416" y="534" font-size="24" fill="#213348" font-weight="400">Ouvrir l’IP de l’écran.</text><rect x="24" y="599" width="712" height="136" rx="18" fill="#fff6ed" stroke="#a04d14" stroke-width="2"/><text x="47" y="635" font-size="23" fill="#213348" font-weight="400">« Pas d’Internet » peut être normal sur cet AP.</text><text x="47" y="667" font-size="23" fill="#213348" font-weight="400">Les mesures restent locales ; régler l’heure si besoin.</text><text x="47" y="699" font-size="23" fill="#213348" font-weight="400">GitHub, NTP et Tempo nécessitent Internet.</text></g></svg>
