<svg xmlns="http://www.w3.org/2000/svg" width="760" height="837" viewBox="0 0 760 837" role="img" aria-labelledby="title desc"><title id="title">Choisir la bonne méthode de mise à jour</title><desc id="desc">Menu tactile avec Internet, fichier OTA .bin via la page Web de l’écran, ou pack USB sur instruction d’assistance.</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#007dad"/></marker><marker id="brown" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a04d14"/></marker></defs><rect width="760" height="837" rx="22" fill="#f5f8fc"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="49" font-size="32" fill="#102f45" font-weight="700">Mettre à jour : quelle méthode ?</text><text x="32" y="86" font-size="23" fill="#213348" font-weight="400">Avant de commencer : exporter les réglages JSON.</text><rect x="24" y="116" width="712" height="171" rx="18" fill="#fff" stroke="#d4dee8" stroke-width="2"/><circle cx="57" cy="154" r="22" fill="#007dad"/><text x="50" y="163" font-size="25" fill="#fff" font-weight="700">1</text><text x="94" y="162" font-size="27" fill="#102f45" font-weight="700">Le menu MISE À JOUR fonctionne</text><text x="48" y="209" font-size="24" fill="#213348" font-weight="400">Avec Internet et l’heure correcte :</text><text x="48" y="242" font-size="24" fill="#213348" font-weight="400">VÉRIFIER SUR GITHUB → INSTALLER → attendre.</text><rect x="24" y="315" width="712" height="200" rx="18" fill="#fff" stroke="#d4dee8" stroke-width="2"/><circle cx="57" cy="353" r="22" fill="#007dad"/><text x="50" y="362" font-size="25" fill="#fff" font-weight="700">2</text><text x="94" y="361" font-size="26" fill="#102f45" font-weight="700">La page Web de l’écran est accessible</text><text x="48" y="408" font-size="24" fill="#213348" font-weight="400">Télécharger le fichier adapté : …_OTA.bin</text><text x="48" y="441" font-size="24" fill="#213348" font-weight="400">Ouvrir l’IP de l’écran → Mise à jour OTA.</text><text x="48" y="474" font-size="24" fill="#213348" font-weight="400">Sélectionner le .bin, installer et attendre.</text><rect x="24" y="543" width="712" height="171" rx="18" fill="#fff" stroke="#d4dee8" stroke-width="2"/><circle cx="57" cy="581" r="22" fill="#007dad"/><text x="50" y="590" font-size="25" fill="#fff" font-weight="700">3</text><text x="94" y="589" font-size="27" fill="#102f45" font-weight="700">Aucune page locale ne répond</text><text x="48" y="636" font-size="24" fill="#213348" font-weight="400">Demander le pack USB adapté et suivre sa notice.</text><text x="48" y="669" font-size="24" fill="#213348" font-weight="400">Décompresser le pack entier avant INSTALLER.bat.</text><text x="32" y="758" font-size="23" fill="#8e4412" font-weight="700">Dans le formulaire OTA : pas de ZIP ni de Source code.</text><text x="32" y="803" font-size="26" fill="#8e4412" font-weight="700">Garder l’alimentation jusqu’au redémarrage.</text></g></svg>
