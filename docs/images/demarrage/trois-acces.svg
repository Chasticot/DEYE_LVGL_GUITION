<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360"><rect width="960" height="360" rx="20" fill="#eef5f6"/><g font-family="Arial, sans-serif" fill="#183144"><text x="30" y="46" font-size="26" font-weight="bold">Trois accès différents : quel mot de passe utiliser ?</text><rect x="24" y="72" width="288" height="200" rx="12" fill="white"/><circle cx="54" cy="105" r="17" fill="#087e8b"/><text x="54" y="112" text-anchor="middle" fill="white" font-size="21">1</text><text x="79" y="112" font-size="19" font-weight="bold">Wi-Fi du logger</text><text x="42" y="153" font-size="19">Menu Wi-Fi du téléphone</text><text x="42" y="182" font-size="19">Nom sur le logger</text><text x="42" y="211" font-size="19">Mot de passe de sa notice</text><text x="42" y="240" font-size="19">DL1000B : champ PWD</text><rect x="336" y="72" width="288" height="200" rx="12" fill="white"/><circle cx="366" cy="105" r="17" fill="#087e8b"/><text x="366" y="112" text-anchor="middle" fill="white" font-size="21">2</text><text x="391" y="112" font-size="19" font-weight="bold">Page locale du logger</text><text x="354" y="153" font-size="19">Dans le navigateur</text><text x="354" y="182" font-size="19">Identifiants Web du logger</text><text x="354" y="211" font-size="19">À créer si demandé</text><text x="354" y="240" font-size="19">à la première connexion</text><rect x="648" y="72" width="288" height="200" rx="12" fill="white"/><circle cx="678" cy="105" r="17" fill="#087e8b"/><text x="678" y="112" text-anchor="middle" fill="white" font-size="21">3</text><text x="703" y="112" font-size="19" font-weight="bold">DeyeCloud / Solarman</text><text x="666" y="153" font-size="19">Compte de l’application</text><text x="666" y="182" font-size="19">Pour les services cloud</text><text x="666" y="211" font-size="19">Pas à saisir dans</text><text x="666" y="240" font-size="19">la connexion de l’écran</text><text x="30" y="310" font-size="20" font-weight="bold">Le QR code du logger ne remplace pas le menu Wi-Fi du téléphone.</text><text x="30" y="338" font-size="16">Schéma explicatif : les exemples ne sont pas les réglages de votre installation.</text></g></svg>